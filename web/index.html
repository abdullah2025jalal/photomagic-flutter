<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="PhotoMagic — استوديو طباعة شبكة الصور A4">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PhotoMagic">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>

  <title>PhotoMagic</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    PWA install support — the exact same behavior as the PhotoMagic web app:
    the banner rectangle appears on every screen while opened in a browser
    (iPhone Safari included) and disappears for good once installed
    (standalone). Here we keep the browser's install event around
    (preventDefault suppresses the mini-infobar) and register a NETWORK-ONLY
    service worker — a fetch handler is what makes the site installable on
    Chrome/Edge/Android, and this worker never caches, so every install runs
    the latest deploy.  iOS Safari never fires the install event; the UI
    falls back to Share -> Add to Home Screen steps.
  -->
  <script>
    function __pmRefreshStandalone() {
      var mql = window.matchMedia('(display-mode: standalone)');
      window.__PM_STANDALONE = mql.matches || window.navigator.standalone === true;
    }
    __pmRefreshStandalone();
    try {
      var __pmMql = window.matchMedia('(display-mode: standalone)');
      if (__pmMql.addEventListener) {
        __pmMql.addEventListener('change', __pmRefreshStandalone);
      }
    } catch (e) {}
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__PM_INSTALL_EVENT = e;
      window.dispatchEvent(new Event('pm-install-available'));
    });
    window.addEventListener('appinstalled', function () {
      window.__PM_INSTALL_EVENT = null;
      window.__PM_INSTALLED = true;
      window.dispatchEvent(new Event('pm-install-done'));
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('sw.js', { scope: './' })
        .catch(function () {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
