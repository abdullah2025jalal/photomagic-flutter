name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Pub Get
        run: flutter pub get

      # The login is REST-based (no Firebase SDK), so the APK needs no secret
      # at all. Debug-signed for sideloading, matching the production pattern.
      - name: Build APK (release, debug-signed)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: photomagic-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
